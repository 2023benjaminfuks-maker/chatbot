<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chatbot - Ramón Díaz</title>
  <link rel="stylesheet" href="style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>

  <!-- Estructura del boceto usando exactamente los nombres indicados -->
  <main class="zona" id="zona">
    <header class="header-bot">
      <div class="avatar">RD</div>
      <div class="bot-info">
        <h2>Ramón Díaz</h2>
        <span class="status">En línea</span>
      </div>
    </header>

    <!-- Contenedor del historial del chat -->
    <section class="chat" id="chat">
      <!-- Los mensajes del bot y usuario se inyectan dinámicamente -->
    </section>

    <!-- Contenedor para opciones dinámicas e inputs -->
    <section class="opciones" id="opciones">
      <!-- Botones cliqueables o campos input de validación -->
    </section>

    <!-- Área reservada para respuestas/estado del usuario -->
    <footer class="respuestas" id="respuestas">
      <!-- Muestra elecciones recordadas del usuario -->
    </footer>
  </main>

  <script src="script.js"></script>
</body>
</html>
